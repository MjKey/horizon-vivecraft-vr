[package]
name = "horizonvr-installer"
version = "0.1.0"
edition = "2024"
license = "LGPL-3.0-or-later"
build = "build.rs"

[[bin]]
name = "HorizonVR-Installer"
path = "src/main.rs"

[dependencies]
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
rfd = "0.15"
mslnk = "0.1"
dirs = "6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Console", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true
