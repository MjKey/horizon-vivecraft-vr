[package]
name = "horizon-vr"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "VR through OpenXR: the unsafe OpenXR and Vulkan calls the crates that forbid unsafe code can't make"

[dependencies]
log = "0.4"
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl"] }
ash = { version = "0.38", default-features = false }
glam = "0.30"
png = "0.18"

[lints]
workspace = true
